#use default parameters
point_mass: true
num_robots: 2
max_vel: 0.8
max_angular_vel: 1.2
max_acc: 0.5
max_angular_acc: 0.5
motor_control: true
m_payload: 0.01
max_f: 1.3
arm_length: 0.046
t2t: 0.006 # thrust-to-torque ratio
m: [0.0345, 0.0345]
l_payload: [0.5, 0.5]
J_vx: [16.571710e-6, 16.571710e-6]
J_vy: [16.655602e-6, 16.655602e-6]
J_vz: [29.261652e-6, 29.261652e-6]
J_v : [16.571710e-6, 16.655602e-6, 29.261652e-6] # inertia matrix
size: [0.4, 0.4]
col_size_robot: 0.1
dt: .01
dynamics: "quad3dpayload_point"
